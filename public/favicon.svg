<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 60 60" width="60" height="60" role="img" aria-label="Lyric Roll">
  <!-- ============================================================
       Lyric Roll ファビコン（2色・3レーン版）
       ロゴ本体（logo-2color.svg）と同じ世界観を、タブ表示用に小さく作り直したもの。
         ・薄めの向日葵イエロー(#FFE08A) と ミクのティール(#86DDD4) の3レーン
         ・再生ライン(playhead)はビビッドピンク(#e12885) のアクセント
       小さく表示されても識別できるよう、要素を絞っている。
       ============================================================ -->
  <defs>
    <!-- 角丸タイルの内側だけ描く（角からはみ出さないよう切り取る）クリップ -->
    <clipPath id="faviconClip">
      <rect x="3" y="3" width="54" height="54" rx="10"/>
    </clipPath>
  </defs>

  <!-- タイル本体（白地＋うっすら水色の枠） -->
  <rect x="3" y="3" width="54" height="54" rx="10" fill="#ffffff" stroke="#cfeff1" stroke-width="2"/>

  <g clip-path="url(#faviconClip)">
    <!-- 真ん中（ティール）のレーンだけ薄く塗って3本を見分けやすくする -->
    <rect x="15" y="21" width="42" height="18" fill="#f4fbfa"/>

    <!-- 左の鍵盤：3レーンぶん（向日葵 / ティール / 向日葵）-->
    <rect x="3" y="3"  width="12" height="18" fill="#FFE08A"/>
    <rect x="3" y="21" width="12" height="18" fill="#86DDD4"/>
    <rect x="3" y="39" width="12" height="18" fill="#FFE08A"/>
    <!-- 鍵盤とレーンの境界線 -->
    <line x1="15" y1="3" x2="15" y2="57" stroke="#cfeff1" stroke-width="2"/>

    <!-- ノート：logo.svg と同じ並び（上=左1個 / 中=3個 / 下=右1個）-->
    <!-- 向日葵レーン（上・左）-->
    <rect x="18" y="7"  width="16" height="10" rx="2.5" fill="#FFE08A"/>
    <!-- ティールレーン（中・3個）-->
    <rect x="16" y="25" width="9"  height="10" rx="2.5" fill="#86DDD4"/>
    <rect x="28" y="25" width="8"  height="10" rx="2.5" fill="#86DDD4"/>
    <rect x="39" y="25" width="10" height="10" rx="2.5" fill="#86DDD4"/>
    <!-- 向日葵レーン（下・右）-->
    <rect x="31" y="43" width="17" height="10" rx="2.5" fill="#FFE08A"/>

    <!-- 再生ライン（playhead）：ビビッドピンク。半透明の帯＋実線 -->
    <rect x="49" y="3" width="3" height="54" fill="#e12885" opacity="0.10"/>
    <line x1="50.5" y1="3" x2="50.5" y2="57" stroke="#e12885" stroke-width="1.5"/>
  </g>
</svg>
