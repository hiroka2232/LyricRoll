<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" width="480" height="200" role="img" aria-label="LYRIC ROLL">

  <defs>
    <!-- 角丸タイルの内側だけにノートを描く（はみ出した分を切り取り、流れている感を出す）ためのクリップ -->
    <clipPath id="rollClip">
      <rect x="24" y="28" width="176" height="144" rx="14"/>
    </clipPath>
  </defs>

  <!-- ピアノロールのタイル本体（白地＋うっすら水色の枠）。アプリの色調に合わせている -->
  <rect x="24" y="28" width="176" height="144" rx="14" fill="#ffffff" stroke="#cfeff1" stroke-width="2"/>

  <!-- 中身（レーン・鍵盤・ノート・再生ライン）は角丸の内側にクリップして描く -->
  <g clip-path="url(#rollClip)">

    <!-- 真ん中のレーンだけごく薄く塗って、3本のレーンを見分けやすくする -->
    <rect x="44" y="76" width="156" height="48" fill="#f4fbfa"/>

    <!-- 左の鍵盤：3レーンぶん（向日葵 / ティール / 向日葵）。パステル寄りの2色 -->
    <rect x="24" y="28"  width="20" height="48" fill="#FFE08A"/><!-- 向日葵（パステル）-->
    <rect x="24" y="76"  width="20" height="48" fill="#86DDD4"/><!-- ティール（パステル）-->
    <rect x="24" y="124" width="20" height="48" fill="#FFE08A"/><!-- 向日葵（パステル）-->
    <!-- 鍵盤とレーンの境界線 -->
    <line x1="44" y1="28" x2="44" y2="172" stroke="#cfeff1" stroke-width="2"/>

    <!-- 流れる MIDI ノート。レーンの色（向日葵／ティールの2色）に合わせる。
         上=左1個 / 中=3個 / 下=右1個。 -->
    <!-- 向日葵レーン（上）-->
    <rect x="52"  y="41"  width="40" height="22" rx="5" fill="#FFE08A"/>
    <!-- ティールレーン（中・3個）-->
    <rect x="48"  y="89"  width="34" height="22" rx="5" fill="#86DDD4"/>
    <rect x="90"  y="89"  width="30" height="22" rx="5" fill="#86DDD4"/>
    <rect x="128" y="89"  width="44" height="22" rx="5" fill="#86DDD4"/>
    <!-- 向日葵レーン（下）-->
    <rect x="112" y="137" width="40" height="22" rx="5" fill="#FFE08A"/>

    <!-- 再生ライン（playhead）：ビビッドなピンクでアクセントに。半透明の帯＋実線 -->
    <rect x="150" y="28" width="6" height="144" fill="#e12885" opacity="0.10"/>
    <line x1="153" y1="28" x2="153" y2="172" stroke="#e12885" stroke-width="2"/>
  </g>

  <!-- 再生ラインの三角マーカー（タイルの上にちょこんと乗せる。クリップ外に描く）-->
  <path d="M147 22 L159 22 L153 30 Z" fill="#e12885"/>

  <!-- ワードマーク：LYRIC=向日葵（パステル）/ ROLL=ティール（パステル）。
       太さは控えめ（Helvetica の太字700）。薄い色なので、paint-order="stroke" で
       淡いフチを細く敷いて、白地でも輪郭がほのかに出るようにする。 -->
  <g font-family="'Helvetica Neue',Arial,sans-serif" font-weight="700"
     letter-spacing="1" paint-order="stroke" stroke-linejoin="round">
    <text x="224" y="96"  font-size="56" fill="#FFE08A" stroke="#E9C25C" stroke-width="1.2">LYRIC</text>
    <text x="224" y="150" font-size="56" fill="#86DDD4" stroke="#5FC3B8" stroke-width="1.2">ROLL</text>
  </g>
  <text x="226" y="172" font-family="'Helvetica Neue',Arial,sans-serif" font-size="13" letter-spacing="3" fill="#9bb4ba">PIANO-ROLL LYRICS</text>
</svg>
